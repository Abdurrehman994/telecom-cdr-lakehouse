name: CI

on:
  push:
    branches: [main, v2-kafka-lakehouse]
  pull_request:

jobs:
  unit-tests:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [cdr-ingestion, lakehouse]
    defaults:
      run:
        working-directory: fraud-detection-system/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            fraud-detection-system/${{ matrix.service }}/requirements.txt
            fraud-detection-system/requirements-test.txt
      - run: pip install -r requirements.txt -r ../requirements-test.txt
      - run: python -m pytest -v tests

  ml-tests:
    name: ml tests (with Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: alerts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d alerts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_POSTGRES_TESTS: "1"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: alerts_test
    defaults:
      run:
        working-directory: fraud-detection-system/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            fraud-detection-system/ml/requirements.txt
            fraud-detection-system/requirements-test.txt
      - run: pip install -r requirements.txt -r ../requirements-test.txt
      - run: python -m pytest -v tests

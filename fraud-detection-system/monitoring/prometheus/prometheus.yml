global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # consumer lag per group, topic offsets (ingest rate, DLQ)
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'cdr-ingestion'
    static_configs:
      - targets: ['cdr-ingestion:8080']

  - job_name: 'fraud-detection'
    static_configs:
      - targets: ['ml-service:8001', 'ml-service2:8001']

  - job_name: 'lakehouse-writer'
    static_configs:
      - targets: ['lakehouse-writer:8002']

  - job_name: 'lakehouse-maintenance'
    static_configs:
      - targets: ['lakehouse-maintenance:8003']

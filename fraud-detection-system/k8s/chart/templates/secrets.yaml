apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  labels: {{- include "platform.labels" . | nindent 4 }}
stringData:
  s3-access-key: {{ .Values.secrets.s3AccessKey | quote }}
  s3-secret-key: {{ .Values.secrets.s3SecretKey | quote }}
  lakekeeper-encryption-key: {{ .Values.secrets.lakekeeperEncryptionKey | quote }}
  lakekeeper-db-password: {{ .Values.secrets.lakekeeperDbPassword | quote }}
  lakekeeper-db-url: postgresql://lakekeeper:{{ .Values.secrets.lakekeeperDbPassword }}@lakekeeper-db:5432/lakekeeper
  alerts-db-password: {{ .Values.secrets.alertsDbPassword | quote }}
  # SeaweedFS S3 identities and STS: Lakekeeper assumes LakehouseVendedRole to vend
  # short-lived credentials scoped to the bucket
  s3.json: |
    {"identities": [{"name": "lakehouse",
      "credentials": [{"accessKey": "{{ .Values.secrets.s3AccessKey }}", "secretKey": "{{ .Values.secrets.s3SecretKey }}"}],
      "actions": ["Admin", "Read", "Write", "List", "Tagging"]}],
     "sts": {"tokenDuration": "1h", "maxSessionLength": "12h", "issuer": "seaweedfs-sts",
             "signingKey": "{{ .Values.secrets.stsSigningKey }}"},
     "roles": [{"roleName": "LakehouseVendedRole",
                "roleArn": "arn:aws:iam::000000000000:role/LakehouseVendedRole",
                "trustPolicy": {"Version": "2012-10-17", "Statement": [
                  {"Effect": "Allow", "Principal": "*", "Action": "sts:AssumeRole"}]},
                "attachedPolicies": ["LakehouseAccess"]}],
     "policies": [{"name": "LakehouseAccess", "document": {"Version": "2012-10-17", "Statement": [
       {"Effect": "Allow", "Action": "s3:*",
        "Resource": ["arn:aws:s3:::{{ .Values.storage.bucket }}", "arn:aws:s3:::{{ .Values.storage.bucket }}/*"]}]}}]}

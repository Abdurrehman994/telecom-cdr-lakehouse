# The catalog's own Postgres
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lakekeeper-db
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  serviceName: lakekeeper-db
  replicas: 1
  selector:
    matchLabels: {app: lakekeeper-db}
  template:
    metadata:
      labels: {app: lakekeeper-db}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - {name: POSTGRES_USER, value: lakekeeper}
            - {name: POSTGRES_DB, value: lakekeeper}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: lakekeeper-db-password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "lakekeeper", "-d", "lakekeeper"]}
            periodSeconds: 5
          resources:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: lakekeeper-db
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  selector: {app: lakekeeper-db}
  ports: [{port: 5432}]
---
# Iceberg REST catalog; the init container creates or upgrades its database schema
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakekeeper
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: lakekeeper}
  template:
    metadata:
      labels: {app: lakekeeper}
    spec:
      # keep injected LAKEKEEPER_* service variables out of its configuration
      enableServiceLinks: false
      initContainers:
        - name: migrate
          image: {{ .Values.images.lakekeeper }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["migrate"]
          env: &lakekeeper-env
            - name: LAKEKEEPER__PG_DATABASE_URL_READ
              valueFrom: {secretKeyRef: {name: platform-secrets, key: lakekeeper-db-url}}
            - name: LAKEKEEPER__PG_DATABASE_URL_WRITE
              valueFrom: {secretKeyRef: {name: platform-secrets, key: lakekeeper-db-url}}
            - name: LAKEKEEPER__PG_ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: platform-secrets, key: lakekeeper-encryption-key}}
            - {name: RUST_LOG, value: info}
      containers:
        - name: lakekeeper
          image: {{ .Values.images.lakekeeper }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["serve"]
          env: *lakekeeper-env
          ports:
            - {name: http, containerPort: 8181}
            - {name: metrics, containerPort: 9000}
          readinessProbe:
            exec: {command: ["/home/nonroot/lakekeeper", "healthcheck"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["/home/nonroot/lakekeeper", "healthcheck"]}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {memory: 64Mi, cpu: 50m}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: lakekeeper
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  selector: {app: lakekeeper}
  ports:
    - {name: http, port: 8181}
    - {name: metrics, port: 9000}
---
# Bootstraps Lakekeeper and creates the warehouse (a new Job per release revision,
# since a Job's template cannot be changed in place)
apiVersion: batch/v1
kind: Job
metadata:
  name: lakekeeper-init-{{ .Release.Revision }}
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        {{- include "platform.waitFor" (dict "root" . "name" "lakekeeper" "url" "http://lakekeeper:8181/management/v1/info") | nindent 8 }}
        {{- include "platform.waitFor" (dict "root" . "name" "storage" "url" "http://seaweedfs:9333/cluster/status") | nindent 8 }}
      containers:
        - name: lakekeeper-init
          image: {{ .Values.images.lakehouse }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["python", "-u", "lakekeeper_init.py"]
          env:
            {{- include "platform.lakehouseEnv" . | nindent 12 }}
            - {name: LAKEKEEPER_URL, value: "http://lakekeeper:8181"}

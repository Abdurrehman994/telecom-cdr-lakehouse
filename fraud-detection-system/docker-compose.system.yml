  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   environment:
  #     - NVIDIA_VISIBLE_DEVICES=all
  #   restart: unless-stopped

  ml-service:
    build: ./ml/
    container_name: ml-service
    ports:
      - "8001:8001"
    environment:
      OLLAMA_HOST: http://ollama:11434
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: cdr-events
      KAFKA_GROUP_ID: fraud-detection
      KAFKA_DLQ_TOPIC: cdr-events-dlq
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
      prometheus:
        condition: service_started
    networks:
      - fraud-detection-network
    restart: unless-stopped

  ml-service2:
    build: ./ml/
    container_name: ml-service2
    ports:
      - "8002:8001"
    environment:
      OLLAMA_HOST: http://ollama:11434
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: cdr-events
      KAFKA_GROUP_ID: fraud-detection
      KAFKA_DLQ_TOPIC: cdr-events-dlq
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
      prometheus:
        condition: service_started
    networks:
      - fraud-detection-network
    restart: unless-stopped

  cdr-ingestion:
    build:
      context: ./cdr-ingestion
      dockerfile: Dockerfile
    container_name: cdr_ingestion_1
    hostname: cdr-ingestion
    ports:
      - "8080:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: myuser
      RABBITMQ_DEFAULT_PASS: mypassword
      RABBITMQ_USER: myuser
      RABBITMQ_PASSWORD: mypassword
      RABBITMQ_QUEUE: CDR
      SERVICE_NAME: cdr-ingestion
      SERVICE_VERSION: 2.0.0
      CDR_QUEUE_NAME: CDR
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: cdr-events
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: SecureDBPassword456!
      POSTGRES_DB: cdr_database
      DEBUG: "False"
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      # postgres:
      #   condition: service_healthy
    networks:
      - fraud-detection-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka_1
    hostname: kafka
    ports:
      - "9094:9094"     # for tools on the host machine
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # One-shot job: creates topics, then exits (auto topic creation is disabled)
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka_init_1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic cdr-events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic cdr-events-dlq --partitions 1 --replication-factor 1
    networks:
      - fraud-detection-network
    restart: "no"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_1
    hostname: rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: myuser
      RABBITMQ_DEFAULT_PASS: mypassword
    command: >
      bash -c "
      rabbitmq-plugins enable --offline rabbitmq_prometheus &&
      rabbitmq-server
      "
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # postgres:
  #   image: postgres:15-alpine
  #   container_name: postgres_1
  #   hostname: postgres
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_USER: fraud_user
  #     POSTGRES_PASSWORD: SecureDBPassword456!
  #     POSTGRES_DB: cdr_database
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U fraud_user"]
  #     interval: 10s
  #     timeout: 5s

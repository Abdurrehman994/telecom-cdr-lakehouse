  #   networks:
  #     - fraud-detection-network
  #   restart: unless-stopped
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  # example_consumer_1:
  #   build:
  #     context: ./rabbit/
  #     dockerfile: Dockerfile.consumer
  #     # args: 
  #     #   - 
  #   container_name: example_consumer_1
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #   environment:
  #     RABBITMQ_HOST: rabbitmq
  #     RABBITMQ_DEFAULT_USER: myuser
  #     RABBITMQ_DEFAULT_PASS: mypassword
  #   command: ["python", "-u", "main.py"]
  #   networks:
  #     - fraud-detection-network

volumes:
  kafka-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  ollama-data:
  postgres_data:
    driver: local

networks:
  monitoring:
    driver: bridge
  fraud-detection-network:
    driver: bridge
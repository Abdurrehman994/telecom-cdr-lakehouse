# shared by the lakehouse writers, the maintenance job and the catalog setup
x-lakehouse-env: &lakehouse-env
  ICEBERG_CATALOG_URI: http://lakekeeper:8181/catalog
  ICEBERG_WAREHOUSE: lakehouse
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-lakehouse}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-lakehouse-secret}
  S3_BUCKET: warehouse

# the Lakekeeper catalog server and its migration job
x-lakekeeper-env: &lakekeeper-env
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:${LAKEKEEPER_DB_PASSWORD:-lakekeeper-dev-password}@lakekeeper-db:5432/lakekeeper
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:${LAKEKEEPER_DB_PASSWORD:-lakekeeper-dev-password}@lakekeeper-db:5432/lakekeeper
  # encrypts the storage keys Lakekeeper keeps in its database
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:-dev-only-lakekeeper-encryption-key}
  RUST_LOG: info

# the platform client library and the data contracts, for images that need them
x-platform-contexts: &platform-contexts
  dataplatform: ./libs/dataplatform
  contracts: ./contracts

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: fraud-detection-prometheus
    hostname: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - fraud-detection-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: fraud-detection-grafana
    hostname: grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    ports:
      - "3000:3000"
    networks:
      - fraud-detection-network
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: fraud-detection-node-exporter
    hostname: node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - fraud-detection-network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: fraud-detection-alertmanager
    hostname: alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # Ollama - CPU version (recommended for most users)
  ollama:
    image: ollama/ollama:latest
    container_name: fraud-detection-ollama
    hostname: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - fraud-detection-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Uncomment below if you have NVIDIA GPU
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: fraud-detection-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   networks:
  #     - monitoring
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   environment:
  #     - NVIDIA_VISIBLE_DEVICES=all
  #   restart: unless-stopped

  ml-service:
    build:
      context: ./ml/
      additional_contexts: *platform-contexts
    container_name: ml-service
    ports:
      - "8001:8001"
    environment:
      OLLAMA_HOST: http://ollama:11434
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: cdr-events
      KAFKA_GROUP_ID: fraud-detection
      KAFKA_DLQ_TOPIC: cdr-events-dlq
      KAFKA_DECISIONS_TOPIC: fraud-decisions
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cdr_database
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud-dev-password}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      prometheus:
        condition: service_started
    networks:
      - fraud-detection-network
    restart: unless-stopped

  ml-service2:
    build:
      context: ./ml/
      additional_contexts: *platform-contexts
    container_name: ml-service2
    ports:
      - "8002:8001"
    environment:
      OLLAMA_HOST: http://ollama:11434
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: cdr-events
      KAFKA_GROUP_ID: fraud-detection
      KAFKA_DLQ_TOPIC: cdr-events-dlq
      KAFKA_DECISIONS_TOPIC: fraud-decisions
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cdr_database
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud-dev-password}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      prometheus:
        condition: service_started
    networks:
      - fraud-detection-network
    restart: unless-stopped

  cdr-ingestion:
    build:
      context: ./cdr-ingestion
      dockerfile: Dockerfile
      additional_contexts: *platform-contexts
    container_name: cdr_ingestion_1
    hostname: cdr-ingestion
    ports:
      - "8080:8080"
    environment:
      SERVICE_NAME: cdr-ingestion
      SERVICE_VERSION: 2.0.0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: cdr-events
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud-dev-password}
      POSTGRES_DB: cdr_database
      DEBUG: "False"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka_1
    hostname: kafka
    ports:
      - "9094:9094"     # for tools on the host machine
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # One-shot job: creates topics, then exits (auto topic creation is disabled)
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka_init_1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic cdr-events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic cdr-events-dlq --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic fraud-decisions --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic fraud-decisions-dlq --partitions 1 --replication-factor 1
    networks:
      - fraud-detection-network
    restart: "no"

  # Schema registry: the Avro data contract of each topic, with compatibility rules.
  # Schemas are stored in the _schemas topic in Kafka.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.1
    container_name: schema_registry_1
    hostname: schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # One-shot job: registers the data contracts in ./contracts, then exits. It fails,
  # and the producers and consumers that depend on it do not start, if a contract
  # breaks its compatibility rule.
  schema-init:
    build:
      context: ./lakehouse/
      additional_contexts: *platform-contexts
    container_name: schema_init_1
    command: ["python", "-m", "dataplatform.contracts", "apply", "/contracts"]
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - ./contracts:/contracts:ro
    depends_on:
      schema-registry:
        condition: service_healthy
    networks:
      - fraud-detection-network
    restart: "no"

  # S3-compatible object storage for the lakehouse (Parquet data + Iceberg metadata)
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    container_name: seaweedfs_1
    hostname: seaweedfs
    ports:
      - "8333:8333"     # S3 API
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lakehouse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lakehouse-secret}
      S3_BUCKET: warehouse
      # signs the short-lived credentials STS hands out (base64, at least 32 bytes)
      S3_STS_SIGNING_KEY: ${S3_STS_SIGNING_KEY:-ZGV2LW9ubHktc3RzLXNpZ25pbmcta2V5LWZvci1zZWF3ZWVkZnM=}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cat > /tmp/s3.json <<EOF
        {"identities": [{"name": "lakehouse",
          "credentials": [{"accessKey": "$$S3_ACCESS_KEY", "secretKey": "$$S3_SECRET_KEY"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]}],
         "sts": {"tokenDuration": "1h", "maxSessionLength": "12h", "issuer": "seaweedfs-sts",
                 "signingKey": "$$S3_STS_SIGNING_KEY"},
         "roles": [{"roleName": "LakehouseVendedRole",
                    "roleArn": "arn:aws:iam::000000000000:role/LakehouseVendedRole",
                    "trustPolicy": {"Version": "2012-10-17", "Statement": [
                      {"Effect": "Allow", "Principal": "*", "Action": "sts:AssumeRole"}]},
                    "attachedPolicies": ["LakehouseAccess"]}],
         "policies": [{"name": "LakehouseAccess", "document": {"Version": "2012-10-17", "Statement": [
           {"Effect": "Allow", "Action": "s3:*", "Resource": ["arn:aws:s3:::$$S3_BUCKET", "arn:aws:s3:::$$S3_BUCKET/*"]}]}}]}
        EOF
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/tmp/s3.json -s3.iam.config=/tmp/s3.json
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # Iceberg REST catalog: tracks which metadata file is the current version of each table,
  # with its state in Postgres, and vends short-lived storage credentials to engines
  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.13.8
    container_name: lakekeeper_1
    hostname: lakekeeper
    command: ["serve"]
    ports:
      - "8181:8181"     # REST catalog (/catalog), management API and UI (/ui)
    environment:
      <<: *lakekeeper-env
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # One-shot job: creates or upgrades the catalog's database schema
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.13.8
    container_name: lakekeeper_migrate_1
    command: ["migrate"]
    environment:
      <<: *lakekeeper-env
    depends_on:
      lakekeeper-db:
        condition: service_healthy
    networks:
      - fraud-detection-network
    restart: "no"

  # One-shot job: bootstraps Lakekeeper and creates the lakehouse warehouse
  lakekeeper-init:
    build:
      context: ./lakehouse/
      additional_contexts: *platform-contexts
    container_name: lakekeeper_init_1
    command: ["python", "-u", "lakekeeper_init.py"]
    environment:
      <<: *lakehouse-env
      LAKEKEEPER_URL: http://lakekeeper:8181
    depends_on:
      lakekeeper:
        condition: service_healthy
    networks:
      - fraud-detection-network
    restart: "no"

  # The catalog's own database, apart from the application's Postgres
  lakekeeper-db:
    image: postgres:17-alpine
    container_name: lakekeeper_db_1
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: ${LAKEKEEPER_DB_PASSWORD:-lakekeeper-dev-password}
      POSTGRES_DB: lakekeeper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - lakekeeper-db-data:/var/lib/postgresql/data
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # SQL query engine over the lakehouse tables (http://localhost:8085)
  trino:
    image: trinodb/trino:484
    container_name: trino
    hostname: trino
    ports:
      - "8085:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/queries.sql:/etc/trino/queries.sql:ro
    # the JVM sizes its heap from this limit
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # Lakehouse sinks: one writer per sink file in ./lakehouse/sinks. Adding a dataset
  # takes a contract, a sink file and a service like these; no code.

  # Streams cdr-events into the Iceberg table telecom.cdr_events
  lakehouse-writer:
    build:
      context: ./lakehouse/
      additional_contexts: *platform-contexts
    container_name: lakehouse_writer_1
    command: ["python", "-u", "writer.py", "sinks/cdr_events.yaml"]
    environment:
      <<: *lakehouse-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # empty: use the batch size in the sink file; set them to experiment (e.g. a load test)
      FLUSH_MAX_RECORDS: ${LAKEHOUSE_FLUSH_MAX_RECORDS:-}
      FLUSH_INTERVAL_SECONDS: ${LAKEHOUSE_FLUSH_INTERVAL_SECONDS:-}
      METRICS_PORT: 8002
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-init:
        condition: service_completed_successfully
      lakekeeper-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # Streams fraud-decisions into the Iceberg table telecom.fraud_decisions
  lakehouse-writer-fraud-decisions:
    build:
      context: ./lakehouse/
      additional_contexts: *platform-contexts
    container_name: lakehouse_writer_fraud_decisions_1
    command: ["python", "-u", "writer.py", "sinks/fraud_decisions.yaml"]
    environment:
      <<: *lakehouse-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      METRICS_PORT: 8002
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-init:
        condition: service_completed_successfully
      lakekeeper-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # Iceberg table maintenance on a schedule, for every sink's table, with the policy
  # in its sink file: compaction, snapshot expiry, orphan files
  lakehouse-maintenance:
    build:
      context: ./lakehouse/
      additional_contexts: *platform-contexts
    container_name: lakehouse_maintenance_1
    command: ["python", "-u", "maintenance.py", "loop"]
    environment:
      <<: *lakehouse-env
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-3600}
      METRICS_PORT: 8003
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # Consumer lag per group and topic offsets (ingest and DLQ rates) for Prometheus
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka_exporter_1
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # OLTP database: fraud alerts and case status (schema in ./postgres/init)
  postgres:
    image: postgres:15-alpine
    container_name: postgres_1
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud-dev-password}
      POSTGRES_DB: cdr_database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cdr_database"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraud-detection-network
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  kafka-data:
  seaweedfs-data:
  lakekeeper-db-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  ollama-data:
  postgres_data:
    driver: local

networks:
  monitoring:
    driver: bridge
  fraud-detection-network:
    driver: bridge
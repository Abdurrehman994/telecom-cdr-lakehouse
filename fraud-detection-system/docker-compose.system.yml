services:
  prometheus:
    image: prom/prometheus:latest
    container_name: fraud-detection-prometheus
    hostname: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - fraud-detection-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: fraud-detection-grafana
    hostname: grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3000:3000"
    networks:
      - fraud-detection-network
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: fraud-detection-node-exporter
    hostname: node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - fraud-detection-network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: fraud-detection-alertmanager
    hostname: alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # Ollama - CPU version (recommended for most users)
  ollama:
    image: ollama/ollama:latest
    container_name: fraud-detection-ollama
    hostname: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - fraud-detection-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Uncomment below if you have NVIDIA GPU
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: fraud-detection-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   networks:
  #     - monitoring
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   environment:
  #     - NVIDIA_VISIBLE_DEVICES=all
  #   restart: unless-stopped

  ml-service:
    build: ./ml/
    container_name: ml-service
    ports:
      - "8001:8001"
    environment:
      OLLAMA_HOST: http://ollama:11434
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: cdr-events
      KAFKA_GROUP_ID: fraud-detection
      KAFKA_DLQ_TOPIC: cdr-events-dlq
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cdr_database
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud-dev-password}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      prometheus:
        condition: service_started
    networks:
      - fraud-detection-network
    restart: unless-stopped

  ml-service2:
    build: ./ml/
    container_name: ml-service2
    ports:
      - "8002:8001"
    environment:
      OLLAMA_HOST: http://ollama:11434
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: cdr-events
      KAFKA_GROUP_ID: fraud-detection
      KAFKA_DLQ_TOPIC: cdr-events-dlq
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cdr_database
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud-dev-password}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      prometheus:
        condition: service_started
    networks:
      - fraud-detection-network
    restart: unless-stopped

  cdr-ingestion:
    build:
      context: ./cdr-ingestion
      dockerfile: Dockerfile
    container_name: cdr_ingestion_1
    hostname: cdr-ingestion
    ports:
      - "8080:8080"
    environment:
      SERVICE_NAME: cdr-ingestion
      SERVICE_VERSION: 2.0.0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: cdr-events
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud-dev-password}
      POSTGRES_DB: cdr_database
      DEBUG: "False"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka_1
    hostname: kafka
    ports:
      - "9094:9094"     # for tools on the host machine
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # One-shot job: creates topics, then exits (auto topic creation is disabled)
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka_init_1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic cdr-events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic cdr-events-dlq --partitions 1 --replication-factor 1
    networks:
      - fraud-detection-network
    restart: "no"

  # S3-compatible object storage for the lakehouse (Parquet data + Iceberg metadata)
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    container_name: seaweedfs_1
    hostname: seaweedfs
    ports:
      - "8333:8333"     # S3 API
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lakehouse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lakehouse-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cat > /tmp/s3.json <<EOF
        {"identities": [{"name": "lakehouse",
          "credentials": [{"accessKey": "$$S3_ACCESS_KEY", "secretKey": "$$S3_SECRET_KEY"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        EOF
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # Iceberg REST catalog: tracks which metadata file is the current version of each table
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.1
    container_name: iceberg_rest_1
    hostname: iceberg-rest
    user: root
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      # catalog state in SQLite on a volume, so tables survive restarts
      CATALOG_URI: jdbc:sqlite:file:/catalog/iceberg_catalog.db
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-lakehouse}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-lakehouse-secret}
      AWS_REGION: us-east-1
    volumes:
      - iceberg-catalog:/catalog
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # Streams cdr-events into the Iceberg table telecom.cdr_events
  lakehouse-writer:
    build: ./lakehouse/
    container_name: lakehouse_writer_1
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: cdr-events
      KAFKA_GROUP_ID: lakehouse-writer
      KAFKA_DLQ_TOPIC: cdr-events-dlq
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      ICEBERG_TABLE: telecom.cdr_events
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-lakehouse}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-lakehouse-secret}
      S3_BUCKET: warehouse
      FLUSH_MAX_RECORDS: 500
      FLUSH_INTERVAL_SECONDS: 10
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      iceberg-rest:
        condition: service_started
    networks:
      - fraud-detection-network
    restart: unless-stopped

  # OLTP database: fraud alerts and case status (schema in ./postgres/init)
  postgres:
    image: postgres:15-alpine
    container_name: postgres_1
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud-dev-password}
      POSTGRES_DB: cdr_database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cdr_database"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraud-detection-network
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  kafka-data:
  seaweedfs-data:
  iceberg-catalog:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  ollama-data:
  postgres_data:
    driver: local

networks:
  monitoring:
    driver: bridge
  fraud-detection-network:
    driver: bridge